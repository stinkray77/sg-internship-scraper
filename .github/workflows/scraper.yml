name: Internship Scraper
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '12,42 * * * *'
    - cron: '32 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: dry-run
        type: choice
        options: [dry-run, canary, live]
      group:
        description: Sources to run
        required: true
        default: all
        type: choice
        options: [all, official, discovery, maintenance]
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: scraper-${{ github.event.schedule || inputs.group || 'all' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_LOOKBACK_HOURS: '72'
          RESULTS_PER_SOURCE: '50'
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_GROUP: ${{ inputs.group }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            case "$EVENT_SCHEDULE" in
              '7,17,27,37,47,57 * * * *') group=official ;;
              '12,42 * * * *') group=discovery ;;
              *) group=maintenance ;;
            esac
            python main.py --group "$group"
          elif [ "$REQUESTED_MODE" = canary ]; then
            python main.py --canary
          elif [ "$REQUESTED_MODE" = live ]; then
            python main.py --group "$REQUESTED_GROUP"
          else
            python main.py --dry-run --group "$REQUESTED_GROUP"
          fi
